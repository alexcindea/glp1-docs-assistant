[project]
name = "api"
version = "0.1.0"
description = "FastAPI app and ingest worker"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.120",
    "openai>=3.27",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",  # MIT; the `vector` column type for SQLAlchemy (and Alembic reflection)
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    # <2.1: opentelemetry-instrumentation-sqlalchemy 0.66b1 refuses 2.1 (no DB spans).
    "pypdfium2>=5",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
# API and worker: the local embedding model (app.local_embedder). transformers is
# Apache-2.0, torch BSD-3. torch/torchvision are listed so the CPU-only index below
# applies (uv overrides sources for direct dependencies only).
embed = [
    "torch>=2.6",
    "transformers>=4.51",  # Qwen3 support
]
# Worker only: PDF parsing and OCR, plus the embedder.
ingest = [
    "api[embed]",
    "docling[rapidocr]>=2.135",
    # <3.10: docling 2.135 reads PP_OCRV6_LANGS, which rapidocr 3.10.0 moved.
    "rapidocr>=3.9.1,<3.10",
    "torchvision>=0.21",
]

[tool.uv.sources]
# PyPI's Linux wheels bundle ~2.5 GB of CUDA libraries we never use.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
    "testcontainers>=4.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PT", "BLE", "C4",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; throwaway test credentials

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real model calls cost money: only when asked for (`-m llm` replaces this filter).
addopts = "-ra --strict-markers -m 'not llm'"
markers = [
    "db: starts a real Postgres in Docker via testcontainers",
    "ingest: runs Docling (needs the ingest extra; downloads models on first run)",
    "embed: runs a local embedding model (needs the embed extra; downloads it on first run)",
    "llm: calls the real OpenAI API (needs OPENAI_API_KEY; costs money): pytest -m llm",
]
