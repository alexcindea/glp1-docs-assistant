name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets anywhere: the LLM and embedder are deterministic fakes.
env:
  LLM_PROVIDER: fake
  EMBEDDER: fake

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # astral publishes no short major tags
        with:
          enable-cache: true
      # The ingest extra (Docling, CPU PyTorch) is needed to type-check and test the parser.
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Docling's layout and table models (~500 MB), RapidOCR's, and the embedding
      # model the tests load (pinned in app/embedding_models.py); downloaded once.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            .venv/lib/python3.12/site-packages/rapidocr/models
          key: models-${{ hashFiles('uv.lock', 'services/api/app/embedding_models.py') }}
      # Builds services/db and runs the database tests against it (testcontainers).
      - run: uv run pytest
      # The eval harness's own tests (recall metric, gold loader); from the repo root.
      - run: uv run pytest
        working-directory: .

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-types:
    name: Generated API types match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # astral publishes no short major tags
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --all-packages --frozen
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web gen:api
      - name: Fail if the committed types are stale (run `pnpm gen:api` and commit)
        run: git diff --exit-code -- apps/web/openapi.json apps/web/src/lib/api/schema.d.ts

  hygiene:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # astral publishes no short major tags
      # The web hooks need node_modules; the web job covers them.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: web-format,web-lint

  stack:
    name: Full stack comes up healthy, ingests a PDF and searches it
    runs-on: ubuntu-latest
    # The images as shipped: the real embedding model, baked in, loaded offline.
    env:
      EMBEDDER: qwen3-0.6b
    steps:
      - uses: actions/checkout@v7
      # The images carry CPU PyTorch twice and ~1.7 GB of models; building them needs
      # more than the runner's ~14 GB free. Its preinstalled SDKs (unused) take ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - name: Build and start every service, wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API is ready and the web health page renders
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/health | grep -q "Everything the app needs is running"
      - name: The worker image ingests a PDF (a text page and a scanned page)
        run: |
          pdf=services/api/tests/fixtures/two-pages.pdf
          id=$(curl --fail --silent --show-error -F "file=@$pdf;type=application/pdf" \
            http://127.0.0.1:8000/documents | jq -r .id)
          for _ in $(seq 1 60); do
            status=$(curl --fail --silent http://127.0.0.1:8000/documents/$id | jq -r .status)
            echo "$status"
            [ "$status" = ready ] && break
            [ "$status" = failed ] && exit 1
            sleep 5
          done
          [ "$status" = ready ]
          chunks=$(curl --fail --silent http://127.0.0.1:8000/documents/$id/chunks | jq length)
          echo "$chunks chunks"
          [ "$chunks" -gt 0 ]
          echo "$id" > document-id
      - name: Search finds a passage with its page and box (hybrid retrieval, real embedder)
        run: |
          body=$(jq -n --arg id "$(cat document-id)" \
            '{query: "identified risks in risk management", document_ids: [$id]}')
          hit=$(curl --fail --silent --show-error -H 'content-type: application/json' \
            -d "$body" http://127.0.0.1:8000/search | jq '.hits[0]')
          echo "$hit" | jq '{ranks, page: .chunk.spans[0].page, text: .chunk.text[0:80]}'
          # The top hit is about risks, and both searches found it.
          echo "$hit" | jq -e '(.chunk.text | test("risk"; "i"))
            and .chunk.spans[0].page >= 1 and .ranks.vector != null and .ranks.bm25 != null'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
