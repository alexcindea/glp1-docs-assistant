name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets anywhere: the LLM and embedder are deterministic fakes.
env:
  LLM_PROVIDER: fake
  EMBEDDER: fake

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # astral publishes no short major tags
        with:
          enable-cache: true
      # The ingest extra (Docling, CPU PyTorch) is needed to type-check and test the parser.
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Builds services/db and runs the database tests against it (testcontainers).
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-types:
    name: Generated API types match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # astral publishes no short major tags
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --all-packages --frozen
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web gen:api
      - name: Fail if the committed types are stale (run `pnpm gen:api` and commit)
        run: git diff --exit-code -- apps/web/openapi.json apps/web/src/lib/api/schema.d.ts

  hygiene:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # astral publishes no short major tags
      # The web hooks need node_modules; the web job covers them.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: web-format,web-lint

  stack:
    name: Full stack comes up healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every service, wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API is ready and the web health page renders
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/health | grep -q "Everything the app needs is running"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
