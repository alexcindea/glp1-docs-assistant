# Workspace root. Not a package: it exists so `uv run` from the repo root
# (evals, scripts) can import the API code, and so there is one lockfile.
[project]
name = "docs-assistant"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["api"]

[tool.uv]
package = false

[tool.uv.sources]
api = { workspace = true }

# CPU-only PyTorch for Docling (see services/api/pyproject.toml).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["services/api"]

# scripts/ and evals/ follow the same style as services/api (which has its own,
# stricter lint config).
[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
